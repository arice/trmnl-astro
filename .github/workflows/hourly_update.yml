name: Update TRMNL Transit Chart

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-chart:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          # Install the symbol font from the repo rather than the network. The
          # previous version fetched a font over HTTP and that URL had been
          # 404ing for the life of the project: curl wrote the 9-byte "Not Found"
          # body to a .ttf, fc-cache ignored it, and every chart silently
          # rendered in a fallback face. Fail loudly instead of quietly.
          mkdir -p ~/.local/share/fonts
          cp fonts/Astronomicon.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -q Astronomicon || { echo "Astronomicon did not register"; exit 1; }
          pip install requests cairosvg pillow svgwrite pyyaml
      
      - name: Generate and update chart
        env:
          ASTROLOGER_API_URL: ${{ secrets.ASTROLOGER_API_URL }}
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
          PLUGIN_UUID: ${{ secrets.PLUGIN_UUID }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: |
          python trmnl_astrology.py
      
      - name: Commit and push charts
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/chart.png docs/dev-chart.png docs/last_positions.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update chart: $(date '+%Y-%m-%d %H:%M UTC')"
          git push
